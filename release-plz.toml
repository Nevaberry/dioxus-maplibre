# release-plz configuration
# https://release-plz.ieni.dev/docs/config

[workspace]
# The production branch is the release gate. Publish a version committed to
# that branch when it is not already present in the registry.
release = true
release_always = true
publish = true

# Create the matching v<version> tag and GitHub release.
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"

# Keep changelog updates enabled for local release preparation.
changelog_update = true

[changelog]
# Changelog format
body = """
## What's Changed

{% for commit in commits %}
- {{ commit.message }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
"""

# Commit types to include in changelog
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Miscellaneous" },
]
