# release-plz configuration
# https://release-plz.ieni.dev/docs/config

[workspace]
# Process this crate, but publish only after a release-plz PR is merged into
# production. A normal main -> production promotion prepares the release PR;
# merging that generated PR publishes the crate and creates its tag/release.
release = true
release_always = false
publish = true

# Create the matching v<version> tag and GitHub release.
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"

# Update the changelog in the release PR.
changelog_update = true

# Release PR settings.
pr_branch_prefix = "release-plz-"
pr_labels = ["release"]

[changelog]
# Changelog format
body = """
## What's Changed

{% for commit in commits %}
- {{ commit.message }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
"""

# Commit types to include in changelog
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Miscellaneous" },
]
