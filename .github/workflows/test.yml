name: Test

on:
  push:
    branches: [development, main, production]
  pull_request:
    branches: [development, main, production]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit tests (pure Rust)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked --verbose

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check docs (warnings as errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps

  # Build showcase app
  build-showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Install Dioxus CLI
        run: curl -fsSL https://dioxus.dev/install.sh | bash -s -- v0.7.9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build showcase
        run: cd examples/showcase-web && dx bundle --web --release --debug-symbols=false --out-dir dist --locked

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: showcase-dist
          path: examples/showcase-web/dist/public/
          if-no-files-found: error

  # E2E tests with Playwright
  e2e-tests:
    runs-on: ubuntu-latest
    needs: build-showcase
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download showcase build
        uses: actions/download-artifact@v8
        with:
          name: showcase-dist
          path: examples/showcase-web/dist/public/

      - name: Install Playwright
        run: |
          cd e2e
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Type-check E2E tests
        run: cd e2e && bun run typecheck

      - name: Serve and test
        run: |
          cd e2e
          bun run serve:showcase &
          sleep 3
          bun run test --project=chromium

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-screenshots
          path: e2e/test-results/
